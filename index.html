<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FaceMatch｜顔の好み診断</title>
<meta name="description" content="2枚の顔から好きなほうを選ぶだけ。繰り返すと、どんな顔がタイプかが見えてきます。">
<meta name="theme-color" content="#3b5b98">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<!-- ホーム画面に追加したときのアイコンと名前（iOS はマニフェストではなくこちらを見る） -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FaceMatch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<main id="app">

  <section id="screen-loading" class="screen">
    <div class="loader"><span></span><span></span><span></span></div>
  </section>

  <!-- 顔画像が足りないとき -->
  <section id="screen-setup-needed" class="screen" hidden>
    <h1 class="logo">Face<span>Match</span></h1>
    <div class="card note">
      <h2>顔画像を用意してください</h2>
      <p class="dim" id="setup-reason"></p>
      <ol class="steps">
        <li><code>npm install</code></li>
        <li><code>npm run generate -- --dry-run --count 24 --female-ratio 1</code></li>
        <li><code>npm run analyze -- --from &lt;画像フォルダ&gt; --gender female</code></li>
      </ol>
    </div>
  </section>

  <!-- スタート -->
  <section id="screen-start" class="screen" hidden>
    <div class="hero"><img src="icons/mark.png" alt="" width="223" height="436"></div>
    <h1 class="logo">Face<span>Match</span></h1>
    <p class="lead">Pick faces. Find your type.</p>

    <div class="card">
      <div class="choices" id="gender-choices" role="radiogroup" aria-label="診断する顔"></div>
      <div class="choices" id="rounds-choices" role="radiogroup" aria-label="回数"></div>
      <p class="hint">精度はシミュレーションによる推定値です</p>
      <button id="btn-start" class="btn btn-primary btn-block btn-icon"></button>
      <button id="btn-last-result" class="btn btn-ghost btn-block btn-icon" hidden></button>
    </div>
  </section>

  <!-- 診断中 -->
  <section id="screen-play" class="screen" hidden>
    <header class="play-head">
      <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="play-meta">
        <span id="round-label">1 / 30</span>
        <button id="btn-undo" class="btn-round" aria-label="1つ戻る" disabled></button>
      </div>
    </header>

    <div class="arena" id="arena">
      <button class="face-card" data-side="0">
        <img alt="左の顔" id="img-0">
        <span class="burst"></span>
      </button>
      <span class="vs" id="vs"></span>
      <button class="face-card" data-side="1">
        <img alt="右の顔" id="img-1">
        <span class="burst"></span>
      </button>
      <span class="arena-loader" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>

    <div class="skip-wrap">
      <button id="btn-skip" class="btn btn-ghost btn-block btn-icon"></button>
      <p class="skip-lock" id="skip-lock" hidden>NO SKIP</p>
    </div>
  </section>

  <!-- 結果 -->
  <section id="screen-result" class="screen" hidden>
    <p class="result-kicker">あなたのタイプ</p>
    <h1 class="result-title" id="result-title">—</h1>
    <p class="result-formula" id="result-formula"></p>
    <div class="result-tags" id="result-tags"></div>

    <!-- 楽しさが先、分析は後。いちばんの見どころは「好みに近い顔」なので大きく出す。 -->
    <div class="card reveal card-hero" style="--i:0">
      <h2 class="card-title" id="t-top"></h2>
      <div class="top-faces" id="top-faces"></div>
    </div>

    <div class="card reveal" style="--i:1">
      <h2 class="card-title" id="t-chosen"></h2>
      <div class="chosen-strip" id="chosen-strip"></div>
    </div>

    <div class="card reveal" style="--i:2">
      <h2 class="card-title" id="t-style"></h2>
      <p class="style-verdict" id="style-verdict">—</p>
      <div class="style-scale">
        <span class="style-pole">きれい系</span>
        <div class="style-track"><span class="style-marker" id="style-marker"></span></div>
        <span class="style-pole">かわいい系</span>
      </div>
      <p class="card-note" id="style-note"></p>
    </div>

    <!-- 部位ごとのまとめと、その内訳を1枚にまとめる。
         別々のカードにすると、同じ重視度を違う分母で2回見せることになる。 -->
    <div class="card reveal" style="--i:3">
      <h2 class="card-title" id="t-feat"></h2>
      <ul class="facemap-list" id="facemap-list"></ul>
      <p class="feat-lead" id="feat-lead"></p>
      <div id="feature-list"></div>
      <button id="btn-show-rest" class="btn btn-ghost btn-block">くわしく見る</button>
    </div>

    <div class="card reveal" style="--i:4">
      <h2 class="card-title" id="t-look"></h2>
      <p class="card-note" id="look-note"></p>
      <div id="look-list"></div>
    </div>

    <div class="card reveal consistency-card" style="--i:5">
      <div class="gauge">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="gauge-track" cx="50" cy="50" r="42"/>
          <circle class="gauge-fill" id="gauge-fill" cx="50" cy="50" r="42"/>
        </svg>
        <span class="gauge-num" id="consistency-num">0%</span>
      </div>
      <div>
        <p class="consistency-label" id="consistency-label">—</p>
        <p class="card-note">選択のブレの少なさ</p>
      </div>
    </div>

    <div class="actions">
      <button id="btn-copy" class="btn btn-primary btn-block btn-icon"></button>
      <button id="btn-again" class="btn btn-ghost btn-block btn-icon"></button>
    </div>
  </section>

</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
